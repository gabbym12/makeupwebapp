<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Glam Empire - The Game</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="brand">💄 Glam Empire</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="catalog.html">Catalog</a>
      <a href="game.html">Game</a>
    </div>
  </nav>
<main>
  <h1>💄 Glam Empire</h1>
  <div class="sub" id="shopTier">Corner Counter</div>
  <div id="progressWrap"></div>
  <div id="hud">
    <div class="stat"><div class="v" id="coins">0</div><div class="l">Coins</div></div>
    <div class="stat"><div class="v" id="rep">0</div><div class="l">Reputation</div></div>
    <div class="stat"><div class="v" id="day">1</div><div class="l">Day</div></div>
    <div class="stat"><div class="v" id="served">0</div><div class="l">Served</div></div>
  </div>
  <div id="layout">
    <div class="panel"><h2>Customers</h2><div id="customers"></div></div>
    <div class="panel"><h2>Product Shelf</h2><div id="shelf"></div>
      <div id="controls"><button onclick="endDay()">End Day</button><button onclick="save(1)">Save</button><button onclick="resetGame()">Reset</button></div>
    </div>
    <div class="panel" style="width:100%"><h2>Expert Mentors (Upgrades)</h2><div id="mentors"></div></div>
  </div>
  <div id="toast"></div>
  <div id="overlayHolder"></div>
  <div id="eventBanner"></div>
</main>
<script src="game.js"></script>
</body>
</html>
